name: Scheduled eBay Scraper

on:
  schedule:
    # 00:00 UTC = Jam 09:00 WIB / KST
    # Berjalan otomatis Senin - Jumat (1-5)
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Updated Excel Data
        run: |
          git config --global user.name "GitHub Action Scraper"
          git config --global user.email "action@github.com"
          git add DATA_ebay_lightstick_RAW_ONLY.xlsx
          git commit -m "Auto-update ebay raw data on $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
